if(isEdit)$('#deleteRecord').onclick=()=>confirmDelete(r)}
function confirmDelete(r){drawer('Hapus entri?',`<p class="muted">Hapus “${esc(r.title||r.source_title||r.asset_name)}” dari Canva Sheet?</p><div class="row mt-5"><button id="reallyDelete" class="btn danger">Ya, hapus</button><button class="btn" data-close="1">Batal</button></div>`);$('#reallyDelete').onclick=async e=>{if(await deleteRow(r,e.currentTarget))closeDrawer()}}
function detail(r){if(!own(r)){drawer('Entri contoh · Demo',`<h3>${esc(r.title)}</h3><p class="muted mt-3">Salin contoh ini untuk membuat entri yang dapat diedit di Canva Sheet.</p><button id="copyDemo" class="btn primary mt-5">Salin ke workspace</button>`);$('#copyDemo').onclick=async e=>{let {__backendId,...values}=r;if(await createRow(values,e.currentTarget))closeDrawer()};return}form(r.type,r)}
function pending(el,on){if(el){el.disabled=on;el.setAttribute('aria-busy',String(on))}state.autosave=on?'Menyimpan…':'Tersimpan'}
async function createRow(partial,control){if(state.records.length>=999){toast('Batas 999 entri tercapai.');return false}if(!state.ready){toast('Canva Sheet belum siap. Coba muat ulang melalui tombol notifikasi.');return false}pending(control,true);try{let now=new Date().toISOString(),res=await window.dataSdk.create({...base,...partial,created_at:now,updated_at:now});if(!res.isOk){toast('Simpan tidak dapat dikonfirmasi. Muat ulang sebelum mencoba lagi.');return false}toast('Tersimpan ke Canva Sheet.');return true}catch{toast('Simpan tidak dapat dikonfirmasi. Muat ulang sebelum mencoba lagi.');return false}finally{pending(control,false)}}
async function updateRow(r,change,control){pending(control,true);try{let res=await window.dataSdk.update({...r,...change,updated_at:new Date().toISOString()});if(!res.isOk){toast('Perubahan tidak dapat dikonfirmasi. Muat ulang sebelum mencoba lagi.');return false}toast('Perubahan tersimpan.');return true}catch{toast('Perubahan tidak dapat dikonfirmasi. Muat ulang sebelum mencoba lagi.');return false}finally{pending(control,false)}}
async function deleteRow(r,control){pending(control,true);try{let res=await window.dataSdk.delete(r);if(!res.isOk){toast('Penghapusan tidak dapat dikonfirmasi. Muat ulang sebelum mencoba lagi.');return false}state.records=state.records.filter(x=>x.__backendId!==r.__backendId);render();toast('Entri dihapus.');return true}catch{toast('Penghapusan tidak dapat dikonfirmasi. Muat ulang sebelum mencoba lagi.');return false}finally{pending(control,false)}}
async function logActivity(label){await createRow({type:'radar_log',title:label,status:'Dicatat',notes:'Aktivitas Radar Tren · mock'})}
function duplicate(t){return [...ideas(),...content()].find(r=>r.title.toLowerCase()===t.question.toLowerCase()||r.title.toLowerCase().includes(t.headline.toLowerCase().split(' ').slice(0,2).join(' ')))}
function nextSlot(){let d=new Date(),j=new Date(d.toLocaleString('en-US',{timeZone:'Asia/Jakarta'}));for(let i=0;i<8;i++){let x=new Date(j);x.setDate(j.getDate()+i);if([0,1,4].includes(x.getDay())&&(i>0||j.getHours()<7))return new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'short',timeZone:'Asia/Jakarta'}).format(x)+' · 07.00 WIB'}return 'slot berikutnya · 07.00 WIB'}
function trendDetail(t){state.googleSelected=t.id;drawer('Detail sinyal · '+t.headline,`<div class="stack"><span class="badge">Mock ${t.tab==='rss'?'feed':'trend signal'} · ${esc(t.fresh)}</span><h3>${esc(t.headline)}</h3><p>${esc(t.summary)}</p><div class="item small"><p><b>URL mock:</b> ${esc(t.url)}</p><p><b>Tanggal publikasi sumber:</b> ${esc(t.date)}</p><p><b>Alasan relevan:</b> ${esc(t.why)}</p><p><b>Format:</b> ${esc(t.format)} · ${ranges[t.format]}</p><p><b>Hook:</b> ${esc(t.hook)}</p><p><b>Visual readiness:</b> ${t.visual}/100 · ${esc(t.visualAsset)}</p><p><b>Slot terdekat:</b> ${esc(nextSlot())} (tidak dijadwalkan otomatis)</p></div>${duplicate(t)?`<div class="item"><b>Topik mirip terdeteksi</b><p class="small muted mt-2">${esc(duplicate(t).title)}</p><button class="btn mt-3" data-open="${esc(duplicate(t).__backendId)}">Lihat item terkait</button><button class="btn mt-3" data-trend="idea" data-id="${t.id}">Tetap gunakan</button></div>`:''}<label class="row item" style="color:var(--ink)"><input type="checkbox" id="verifyChecklist"> Verify official source — pemeriksaan manual, bukan verifikasi otomatis</label><div class="row"><button class="btn primary" data-trend="idea" data-id="${t.id}">Tambah ke Idea Bank</button><button class="btn" data-trend="research" data-id="${t.id}">Mulai riset</button><button class="btn" data-trend="angles" data-id="${t.id}">Buat angle</button></div></div>`);if(state.page==='radar'&&state.tab==='google')drawCharts()}
function angleVariants(t){return [['Flash News',t.question,'Ada satu perubahan yang perlu kamu cek sekarang.','Tahu apa yang berubah','Screenshot pengumuman resmi','Tanggal dan cakupan fitur perlu dicek.'],['Quick Breakdown',t.question,'Mari pahami satu dampak praktis dari topik ini.','Memahami inti perubahan','Screen recording / diagram sederhana','Jangan menganggap sinyal sebagai bukti.'],[t.pillar===pillars[3]?'Myth Buster':'Actionable Tip',t.question,t.pillar===pillars[3]?'Benarkah anggapan populer ini selalu berlaku?':'Coba satu langkah praktis sebelum kamu memutuskan.','Langkah yang bisa diuji','Demo fitur dan screenshot','Periksa ketersediaan fitur pada sumber resmi.']]}
function angles(t){drawer('Tiga angle · Mock',`<p class="small muted mb-4">${esc(t.headline)} · Pilih angle untuk menerapkannya ke formulir ide.</p><div class="stack">${angleVariants(t).map(([f,q,h,val,asset,risk],i)=>`<div class="item"><span class="badge">${esc(f)} · ${ranges[f]}</span><h3 class="mt-2">${esc(q)}</h3><p class="small mt-2"><b>Hook:</b> ${esc(h)}</p><p class="small muted mt-2">Audience value: ${esc(val)} · Visual asset: ${esc(asset)}</p><p class="small muted mt-2">Risk note: ${esc(risk)}</p><button class="btn primary mt-3" data-angle="${t.id}" data-index="${i}">Terapkan ke form ide</button></div>`).join('')}</div>`)}
function ideaModal(t,variant=1){let [fmt,question,hook]=angleVariants(t)[variant];let dupe=duplicate(t);drawer('Impor tren ke Idea Bank',`<p class="small muted mb-4">Sumber: ${esc(t.source)} · Mock feed · ${esc(t.date)}. Tinjau semua field sebelum menyimpan.</p>${dupe?`<div class="item mb-4"><b>Topik mirip terdeteksi</b><p class="small muted mt-2">${esc(dupe.title)}</p><button class="btn mt-2" data-open="${esc(dupe.__backendId)}">Lihat item terkait</button><span class="small muted ml-2">Anda tetap dapat menggunakan topik ini.</span></div>`:''}<form id="importForm"><div class="formgrid">${inp('working','Working title',t.headline,'text',true)}${inp('title','Suggested question title',question,'text',true)}${sel('pillar','Pillar',pillars,t.pillar)}${sel('format','Suggested format',formats,fmt)}${area('hook','Hook',hook)}${inp('source_url','Source URL · mock',t.url,'url')}${area('why','Why it matters',t.why)}${sel('visual_readiness','Visual readiness',['Siap','Perlu aset','Belum dicek'],t.visual>=85?'Siap':'Perlu aset')}${sel('priority','Priority',['Tinggi','Sedang','Rendah'],t.momentum>=85?'Tinggi':'Sedang')}${area('notes','Notes',`Visual: ${t.visualAsset}. Mock signal ${t.momentum}/100. Tanggal sumber: ${t.date}.`)}</div><p id="importError" class="small mt-4" style="color:#ffb5c3" role="alert"></p><div class="row mt-5"><button type="submit" class="btn primary" data-mode="idea">Simpan sebagai ide</button><button type="submit" class="btn" data-mode="research">Simpan lalu buat riset</button><button type="button" class="btn" data-close="1">Batal</button></div></form>`);$('#importForm').onsubmit=async e=>{e.preventDefault();let b=e.submitter,d=Object.fromEntries(new FormData(e.currentTarget).entries()),errors=titleError(d.title);if(errors.length){$('#importError').textContent=errors.join('; ');return}let ok=await createRow({type:'idea',title:d.title,pillar:d.pillar,format:d.format,priority:d.priority,visual_readiness:d.visual_readiness,hook:d.hook,source_url:d.source_url,source_title:d.working,source_platform:t.source,source_pub_date:t.date,status:'Belum diproses',notes:`${d.notes}\nMengapa penting: ${d.why}\nRadar: ${t.id}`},b);if(!ok)return;let s=savedFor(t);if(s)await updateRow(s,{status:'Dijadikan ide'});await logActivity('Tambah ke Idea Bank: '+t.headline);if(b.dataset.mode==='research')await researchHandoff(t,b,true);closeDrawer();go('ideas')}}
async function researchHandoff(t,control,quiet=false){let ok=await createRow({type:'source',title:t.question,source_title:t.headline,source_url:t.url,source_platform:t.source,source_pub_date:t.date,claim:`Klaim awal untuk diperiksa: ${t.summary}`,verification_status:'Perlu Konfirmasi',status:'Perlu Konfirmasi',pillar:t.pillar,notes:`Radar ${t.id} · freshness ${t.fresh} · sumber mock; periksa URL resmi secara manual.`},control);if(ok){await logActivity('Mulai riset: '+t.headline);if(!quiet){closeDrawer();go('research')}}return ok}
function savedModal(t){let r=savedFor(t),m=r?meta(r):{};drawer('Simpan tren',`<form id="saveTrendForm" class="stack">${inp('tags','Tag',m.tags||'Riset, Shorts')}${area('note','Notes',m.note||'Periksa sumber resmi sebelum masuk naskah.')}${sel('status','Status',['Belum diproses','Dijadikan ide','Diarsipkan'],r?.status||'Belum diproses')}<button class="btn primary" type="submit">Simpan tren</button></form>`);$('#saveTrendForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.currentTarget).entries()),data={type:'trend_saved',title:t.headline,pillar:t.pillar,format:t.format,status:d.status,source_url:t.url,source_pub_date:t.date,visual_readiness:String(t.visual),notes:JSON.stringify({trendId:t.id,tags:d.tags,note:d.note})},ok=r?await updateRow(r,data,e.submitter):await createRow(data,e.submitter);if(ok){await logActivity('Save trend: '+t.headline);closeDrawer();render()}}}
function batch(){let picked=[...state.selected].slice(0,5).map(id=>trends.find(t=>t.id===id)).filter(Boolean);if(!picked.length){toast('Pilih tren terlebih dahulu. Maksimal lima ide per batch.');return}drawer('Preview batch ide',`<p class="muted">Konfirmasi ${picked.length} ide draft. Tidak ada jadwal atau verifikasi otomatis.</p><ol class="stack mt-4">${picked.map(t=>`<li class="item"><b>${esc(t.question)}</b><p class="small muted">${esc(t.pillar)} · ${esc(t.format)} · ${esc(t.source)}</p></li>`).join('')}</ol><p id="batchProgress" class="small muted mt-4" aria-live="polite"></p><div class="row mt-5"><button id="confirmBatch" class="btn primary">Simpan ${picked.length} ide</button><button class="btn" data-close="1">Batal</button></div>`);$('#confirmBatch').onclick=async e=>{let btn=e.currentTarget;btn.disabled=true;let saved=0;for(let t of picked){if(state.records.length+saved>=999)break;let ok=await createRow({type:'idea',title:t.question,pillar:t.pillar,format:t.format,hook:t.hook,priority:t.momentum>=85?'Tinggi':'Sedang',visual_readiness:t.visual>=85?'Siap':'Perlu aset',source_url:t.url,source_title:t.headline,source_platform:t.source,source_pub_date:t.date,status:'Belum diproses',notes:`Batch Radar ${t.id} · mock; verifikasi sumber resmi.`});if(!ok)break;saved++;$('#batchProgress').textContent=`${saved}/${picked.length} ide tersimpan.`}if(saved){await logActivity('Batch ide: '+saved+' ide');state.selected.clear();closeDrawer();go('ideas');toast(`${saved} ide batch tersimpan. ${saved<picked.length?'Sebagian belum dapat dikonfirmasi.':''}`)}else btn.disabled=false}}
function presetModal(){drawer('Simpan preset filter',`<form id="presetForm" class="stack">${inp('title','Nama preset',state.tab==='rss'?'AI 72 jam terakhir':'Topik visual-ready','text',true)}<p class="small muted">Menyimpan sub-tab dan filter yang aktif.</p><button type="submit" class="btn primary">Simpan preset</button></form>`);$('#presetForm').onsubmit=async e=>{e.preventDefault();let ok=await createRow({type:'radar_preset',title:$('#f_title').value,notes:JSON.stringify({tab:state.tab,filters:state.filters})},e.submitter);if(ok){closeDrawer();render()}}}
function calcScript(){let title=$('#scriptTitle').value,err=titleError(title),text=['script_hook','script_context','script_payoff','script_ending'].map(k=>$('#'+k).value).join(' '),words=text.trim().split(/\s+/).filter(Boolean).length,wpm=Number($('#scriptWpm').value),seconds=Math.round(words/wpm*60),fmt=$('#scriptFormat').value;$('#titleFeedback').textContent=err.length?'Perbaiki: '+err.join('; '):'✓ Judul sesuai aturan Zeinity';$('#titleFeedback').style.color=err.length?'#ffb5c3':'var(--cyan)';$('#scriptCount').textContent=`${words} kata · ${words>=90&&words<=140?'sesuai target':'di luar target 90–140'}`;$('#durationResult').textContent=`Estimasi ${seconds} detik @ ${wpm} WPM · target ${fmt}: ${ranges[fmt]}.`}
async function saveScript(e){e.preventDefault();let err=titleError($('#scriptTitle').value);if(err.length){toast(err.join('; '));return}let r=content().find(x=>x.__backendId===state.scriptId)||content()[0];if(!own(r)){toast('Salin konten demo lewat Detail sebelum menyimpan naskah.');return}let d={title:$('#scriptTitle').value,format:$('#scriptFormat').value};for(let k of ['script_hook','script_context','script_payoff','script_ending'])d[k]=$('#'+k).value;if(['script_hook','script_context','script_payoff','script_ending'].some(k=>!d[k].trim())){toast('Isi keempat bagian naskah.');return}d.word_count=Object.keys(d).filter(k=>k.startsWith('script_')).map(k=>d[k]).join(' ').trim().split(/\s+/).length;d.duration_estimate=Math.round(d.word_count/Number($('#scriptWpm').value)*60);await updateRow(r,d,e.submitter)}
function exportScript(){let s=`${$('#scriptTitle').value}\nFormat: ${$('#scriptFormat').value}\n\n${['script_hook','script_context','script_payoff','script_ending'].map(k=>k.toUpperCase()+'\n'+$('#'+k).value).join('\n\n')}`,a=document.createElement('a'),url=URL.createObjectURL(new Blob([s],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='zeinity-script.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Naskah diekspor.')}
async function saveCheck(el){let r=content().find(x=>x.__backendId===state.productionId)||content()[0],ok=await updateRow(r,{[el.dataset.check]:el.checked});if(!ok)el.checked=!el.checked}
async function refreshRadar(){if(state.refreshing)return;state.refreshing=true;render();refreshTimer=setTimeout(async()=>{state.updatedAt=new Date().toISOString();state.refreshing=false;render();toast('Radar mock diperbarui. Tidak ada data live yang diambil.');await logActivity('Refresh radar mock')},700)}
async function initialize(){state.ready=false;state.loadError=false;render();clearTimeout(loadTimer);loadTimer=setTimeout(()=>{if(!state.ready){state.loadError=true;render();toast('Data belum termuat. Tekan notifikasi untuk mencoba lagi.')}},8000);try{let result=await window.dataSdk.init({onDataChanged(data){clearTimeout(loadTimer);state.records=data;state.ready=true;state.loadError=false;render()}});if(!result.isOk){clearTimeout(loadTimer);state.loadError=true;render();toast('Canva Sheet gagal dibuka. Tekan notifikasi untuk mencoba lagi.')}}catch{clearTimeout(loadTimer);state.loadError=true;render();toast('Canva Sheet gagal dibuka. Tekan notifikasi untuk mencoba lagi.')}}
document.addEventListener('click',async e=>{
let navEl=e.target.closest('[data-nav]');if(navEl){go(navEl.dataset.nav);if(navEl.dataset.focusTrend)$('#trendSearch')?.focus();return}
if(e.target.closest('[data-close]')){closeDrawer();return}
let tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;state.filters.status='';render();return}
let action=e.target.closest('[data-radar]');if(action){let a=action.dataset.radar;if(a==='refresh')refreshRadar();if(a==='view'){state.cardView=!state.cardView;render()}if(a==='intel'){state.intelOpen=!state.intelOpen;render()}if(a==='filters')$('#radarFilters')?.scrollIntoView({behavior:'smooth'});if(a==='reset'){state.filters={source:'',pillar:'',fresh:'',min:0,status:'',momentum:'',format:'',region:'Indonesia',timeframe:'24 jam terakhir',visual:'',sort:'Highest momentum'};render()}if(a==='preset')presetModal();if(a==='batch')batch();if(a==='clearCompare'){state.compare.clear();render()}if(a==='dismiss'){state.errorDismissed=true;render()}return}
let tAction=e.target.closest('[data-trend]');if(tAction){let t=trends.find(x=>x.id===tAction.dataset.id),a=tAction.dataset.trend;if(!t)return;if(a==='detail')trendDetail(t);if(a==='angles')angles(t);if(a==='idea')ideaModal(t);if(a==='save')savedModal(t);if(a==='source')trendDetail(t);if(a==='research')researchHandoff(t,tAction);if(a==='read'){state.feedRead.add(t.id);render();toast('Ditandai telah dibaca untuk sesi ini.')}if(a==='related')drawer('Related queries · Mock',`<h3>${esc(t.headline)}</h3><ul class="mt-4 stack">${t.related.map(q=>`<li class="item">${esc(q)}</li>`).join('')}</ul><p class="small muted mt-4">Query terkait adalah contoh, bukan data live.</p>`);if(a==='compare'){if(state.compare.has(t.id))state.compare.delete(t.id);else if(state.compare.size>=3){toast('Compare maksimal tiga topik.');return}else state.compare.add(t.id);render();await logActivity('Compare: '+t.headline)}if(a==='archive'){let r=savedFor(t);if(r&&await updateRow(r,{status:'Diarsipkan'},tAction)){await logActivity('Archive: '+t.headline);render()}}return}
let angle=e.target.closest('[data-angle]');if(angle){let t=trends.find(x=>x.id===angle.dataset.angle);ideaModal(t,Number(angle.dataset.index));return}
let open=e.target.closest('[data-open]');if(open){let r=[...state.records,...demoContent,...demoIdeas].find(x=>x.__backendId===open.dataset.open);if(r)detail(r);return}
let create=e.target.closest('[data-new]');if(create){form(create.dataset.new);return}
let convert=e.target.closest('[data-convert]');if(convert){let r=ideas().find(x=>x.__backendId===convert.dataset.convert);if(r)form('content',null,{title:r.title,pillar:r.pillar,format:r.format,hook:r.hook,source_url:r.source_url,status:'Ide'});return}
let calendar=e.target.closest('[data-cal]');if(calendar){let value=calendar.dataset.cal;if(value==='mode')state.calendarMode=state.calendarMode==='week'?'month':'week';else state.calendarOffset=value==='0'?0:state.calendarOffset+Number(value);render();return}
if(e.target.closest('[data-mock-import]'))toast('Mock import YouTube belum terhubung. Input metrik secara manual.');
if(e.target.closest('[data-theme]'))toggleTheme();
let assist=e.target.closest('[data-assist]');if(assist){let outputs=['Topik mock: fitur Shorts, AI lokal, dan kebiasaan digital. Buka Radar Tren untuk meninjau sumber.','Periksa URL resmi, tanggal, kutipan, cakupan fitur, dan klaim secara manual.','Struktur: hook visual → konteks → satu poin inti → penutup.','Gunakan screenshot, screen recording, dokumen resmi, atau demo fitur.'];$('#assistantResult').innerHTML=`<b>${esc(assist.textContent)}</b><p class="muted mt-3">${esc(outputs[Number(assist.dataset.assist)])}</p>`}
});
document.addEventListener('change',e=>{if(e.target.matches('[data-select]')){e.target.checked?state.selected.add(e.target.dataset.select):state.selected.delete(e.target.dataset.select);render()}});
function toggleTheme(){document.body.classList.toggle('light');toast(document.body.classList.contains('light')?'Tema terang aktif.':'Tema gelap aktif.')}
$('#theme').onclick=toggleTheme;$('#collapse').onclick=()=>$('#sidebar').classList.toggle('collapsed');$('#notify').onclick=()=>state.ready?toast('Periksa sumber resmi dan tenggat produksi sebelum publikasi.'):initialize();$('#createTop').onclick=()=>form('content');$('#closeDrawer').onclick=closeDrawer;$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeDrawer()};
$('#globalSearch').oninput=e=>{state.search=e.target.value;if(state.search.trim()&&state.page!=='radar'&&!['ideas','pipeline'].includes(state.page))state.page='radar';render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#globalSearch').focus()}});
initialize();
</script>
 
</body></html>
